name: Release

# Publishes a GitHub release whenever main contains a manifest version
# that has not been released yet (or when a version tag is pushed).
on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attest the build provenance of the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Create the release if this version is new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do."
          else
            gh release create "$version" main.js manifest.json styles.css \
              --target "$GITHUB_SHA" --title "$version" \
              --notes "OnStage $version"
          fi
